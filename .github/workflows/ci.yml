name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build
        run: NODE_OPTIONS="--max-old-space-size=512" npm run build
